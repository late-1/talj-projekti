[project]
name = "talj-projekti"
version = "0.1.0"
description = ""
authors = [
    {name = "Ipsum Lorem",email = "ipsum.lorem"}
]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "getenv (>=0.2.0,<0.3.0)",
    "requests (>=2.32.5,<3.0.0)"
]

[dependency-groups]
dev = [
    "robotframework (>=7.3.2,<8.0.0)",
    "robotframework-browser (>=20.5.0)",
    "robotframework-browser-batteries (>=20.5.0)",
    "pytest (>=8.4.2,<10.0.0)",
    "pylint (>=4.1.3,<5.0.0)"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pylint.main]
# the application modules are imported without the src prefix
init-hook = "import sys; sys.path.insert(0, 'src')"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.variables]
allowed-redefined-builtins = ["id"]

[tool.pylint."messages control"]
disable = [
    # docstrings are written where they help, not everywhere
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # small data classes are fine
    "too-few-public-methods",
    # pytest fixtures are taken as arguments with the name of the fixture,
    # and some are used only for what they set up
    "redefined-outer-name",
    "unused-argument",
]
