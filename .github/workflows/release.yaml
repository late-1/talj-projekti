name: Create release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: ./test.sh unit

      - name: Run pylint
        run: uv run pylint src

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          cat > release-notes.md <<EOF
          # Versio ${VERSION} - Viitteidenhallinta ja BibTeX-vienti

          ## Yhteenveto

          Tämä ensimmäinen täysimittainen julkaisu tarjoaa käyttäjille
          Flask-pohjaisen sovelluksen lähdeviitteiden hallintaan, hakuun,
          muokkaukseen ja BibTeX-muotoiseen vientiin.

          ## Uudet ominaisuudet

          - Käyttäjätunnukset: Käyttäjät voivat luoda tunnuksen sekä kirjautua sisään ja ulos.
          - Viitteiden hallinta: Artikkelit, kirjat ja konferenssijulkaisut voidaan lisätä, muokata, listata ja poistaa.
          - Hakutoiminnot: Yksinkertainen haku ja tarkennettu haku kenttä- sekä vuosivälisuodattimilla.
          - BibTeX-vienti: Viitteiden tiedot voi kopioida BibTeX-muodossa suoraan LaTeX-dokumentteihin.
          - Lähdeluettelonäkymä: BibTeX-sivulta löytyy luettavassa muodossa lähdetyyli ja täytetyt viitetiedot.
          - Joukkopoisto: Useita viitteitä voidaan valita ja poistaa kerralla.
          - Docker-julkaisu: Sovelluksesta on saatavilla Docker-kuva ja OKD-kubernetesmanifestit.

          ## Korjaukset ja parannukset

          - Viiteavain muodostetaan automaattisesti kirjoittajan ja vuoden perusteella tai se voidaan antaa itse.
          - Lisätty kattavat yksikkötestit ja hyväksyntätestit Robot Frameworkilla.
          - Parannettu käyttövarmuutta tietokantatoimintojen validoinnin ja virheenkäsittelyn avulla.
          - Julkaisuprosessiin lisätty testaus, Pylint-tarkistus ja Docker-kuvien automaattinen julkaisu.

          ## Tunnetut ongelmat

          Tunnettuja ongelmia ei ole tällä hetkellä raportoitu.

          ## Linkit ja lisätiedot

          - [Projektin README ja käyttöohjeet](https://github.com/${{ github.repository }}#readme)
          - [Arkkitehtuurikuvaus](https://github.com/${{ github.repository }}/blob/${TAG}/docs/arkkitehtuurikuvaus/README.md)
          - [Muutosloki](https://github.com/${{ github.repository }}/blob/${TAG}/CHANGELOG.md)
          - [Pelisäännöt](https://github.com/${{ github.repository }}/blob/${TAG}/pelisaannot.md)
          - Docker-kuva: \`ghcr.io/${{ github.repository }}:${TAG}\`

          **Full Changelog:** https://github.com/${{ github.repository }}/commits/${TAG}
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Versio ${VERSION} - Viitteidenhallinta ja BibTeX-vienti" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "$TAG" \
              --title "Versio ${VERSION} - Viitteidenhallinta ja BibTeX-vienti" \
              --notes-file release-notes.md \
              --verify-tag
          fi
