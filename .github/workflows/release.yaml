name: Create release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: ./test.sh unit

      - name: Run pylint
        run: uv run pylint src

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # julkaisun kuvaus on CHANGELOG.md:n kohta "## <versio> - <päivämäärä>"
          # seuraavaan "## "-otsikkoon asti
          awk -v version="$VERSION" '
            /^## / { if (found) exit; if ($2 == version) { found = 1; next } }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > changes.md || {
            echo "::error::CHANGELOG.md:stä puuttuu kohta '## ${VERSION} - <päivämäärä>'"
            exit 1
          }
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md:n kohta ${VERSION} on tyhjä"
            exit 1
          fi

          {
            cat changes.md
            cat <<EOF

          ## Linkit ja lisätiedot

          - [Projektin README ja käyttöohjeet](https://github.com/${{ github.repository }}#readme)
          - [Arkkitehtuurikuvaus](https://github.com/${{ github.repository }}/blob/${TAG}/docs/arkkitehtuurikuvaus/README.md)
          - [Muutosloki](https://github.com/${{ github.repository }}/blob/${TAG}/CHANGELOG.md)
          - [Pelisäännöt](https://github.com/${{ github.repository }}/blob/${TAG}/pelisaannot.md)
          - Docker-kuva: \`ghcr.io/${{ github.repository }}:${TAG}\`

          **Full Changelog:** https://github.com/${{ github.repository }}/commits/${TAG}
          EOF
          } > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Versio ${VERSION}" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "$TAG" \
              --title "Versio ${VERSION}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
