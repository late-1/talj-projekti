name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Run unit tests
        run: ./test.sh unit
      - name: Install Playwright browser
        run: uv run rfbrowser install --with-deps chromium
      - name: Run robot tests
        run: ./test.sh robot
        env:
          SKIP_BROWSER_INSTALL: 1
      - name: Upload robot report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: |
            log.html
            report.html
            output.xml
            robot_server.log
      - name: Run pylint
        run: uv run pylint src
