{% extends "layout.html" %}

{% block title %}Add reference{% endblock %}

{% block content %}
<div class="narrow add-reference">
  <h1>add reference</h1>
  <form action="/add" method="post" class="form" id="reference-form">
    {% include "reference_fields.html" %}

    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" value="add reference" />
  </form>
</div>
{% if duplicate %}
{% with action="add" %}{% include "duplicate_dialog.html" %}{% endwith %}
{% endif %}
<script src="/static/reference_form.js"></script>
<script src="/static/type_choice.js"></script>
{% endblock %}
