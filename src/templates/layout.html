<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{% endblock %} · bibtexgen</title>
  <link rel="stylesheet" href="/static/main.css">
</head>

<body>
  {% if session.user_id %}
  <nav class="top-bar">
    <div class="nav-left">
      <a href="/add" {% if request.endpoint == "add_reference" %}class="active" aria-current="page"{% endif %}>add</a>
      <a href="/references" {% if request.endpoint in ["list_references", "show_reference", "edit_reference"] %}class="active" aria-current="page"{% endif %}>view / search</a>
    </div>
    <div class="nav-center">
      <span class="brand">bibtexgen</span>
    </div>
    <div class="nav-right">
      <a href="/logout">log out</a>
    </div>
  </nav>
  {% endif %}

  {% for category, message in get_flashed_messages(with_categories=true) %}
  <div class="flash{% if category == "notice" %} notice{% endif %}">
    {{ message }}
  </div>
  {% endfor %}

  <main>
  {% block content %}{% endblock %}
  </main>
</body>

</html>
